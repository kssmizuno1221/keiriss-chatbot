<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社経理サポートスタッフ | ご案内チャット</title>
<style>
  :root{
    --navy:#1f3b57;
    --navy-dark:#152a3f;
    --blue-accent:#4a90c2;
    --blue-light:#eaf3fa;
    --gray-bg:#f5f7f9;
    --gray-text:#5a6672;
    --white:#ffffff;
    --border:#dbe4ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--gray-bg);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:480px;
    background:var(--white);
    border-radius:16px;
    box-shadow:0 8px 30px rgba(31,59,87,0.15);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:85vh;
    max-height:720px;
  }
  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:var(--white);
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--blue-accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    flex-shrink:0;
  }
  header .titles{
    line-height:1.4;
  }
  header .company{
    font-size:15px;
    font-weight:bold;
  }
  header .sub{
    font-size:12px;
    color:#c7d6e3;
  }
  .chat-area{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--gray-bg);
  }
  .bubble-row{
    display:flex;
    width:100%;
  }
  .bubble-row.bot{ justify-content:flex-start; }
  .bubble-row.user{ justify-content:flex-end; }
  .bubble{
    max-width:78%;
    padding:11px 15px;
    border-radius:16px;
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .bubble.bot{
    background:var(--white);
    color:#2a2f34;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .bubble.user{
    background:var(--navy);
    color:var(--white);
    border-bottom-right-radius:4px;
  }
  .bubble.bot a{ color:var(--blue-accent); }
  .quick-replies{
    flex-shrink:0;
    max-height:34%;
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--border);
    background:var(--white);
    padding:8px 16px 10px;
  }
  .quick-label{
    font-size:11px;
    color:var(--gray-text);
    margin-bottom:5px;
    flex-shrink:0;
  }
  .qr-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    overflow-y:auto;
  }
  .qr-btn{
    background:var(--blue-light);
    color:var(--navy);
    border:1px solid var(--border);
    border-radius:16px;
    padding:5px 11px;
    font-size:12px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .qr-btn:hover{
    background:#dcebf6;
  }
  .qr-btn:active{
    transform:scale(0.97);
  }
  .qr-btn:disabled{
    opacity:0.45;
    cursor:default;
  }
  .reset-row{
    margin-top:6px;
    flex-shrink:0;
    text-align:right;
  }
  .reset-btn{
    background:none;
    border:none;
    color:var(--gray-text);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
  .typing{
    display:flex;
    gap:4px;
    padding:4px 0;
  }
  .typing span{
    width:6px;
    height:6px;
    background:var(--gray-text);
    border-radius:50%;
    opacity:0.5;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{
    0%,80%,100%{ opacity:0.3; }
    40%{ opacity:1; }
  }
  .chat-area::-webkit-scrollbar{ width:6px; }
  .chat-area::-webkit-scrollbar-thumb{ background:#c9d5de; border-radius:3px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">経</div>
    <div class="titles">
      <div class="company">株式会社経理サポートスタッフ</div>
      <div class="sub">ご案内チャット（よくあるご質問）</div>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="bubble-row bot">
      <div class="bubble bot">こんにちは！株式会社経理サポートスタッフのご案内チャットです。下のボタンからよくあるご質問をお選びください。</div>
    </div>
  </div>

  <div class="quick-replies">
    <div class="quick-label">質問を選んでください</div>
    <div class="qr-buttons" id="qrButtons"></div>
    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">最初からやり直す</button>
    </div>
  </div>
</div>

<script>
const faqs = [
  {
    q: "どんなサービスを行っている会社ですか？",
    a: "経理・総務・税理士事務所のお仕事に特化した人材紹介・派遣サービスを行っています。「正社員紹介」「紹介予定派遣」「派遣」の3つの形で、あなたに合った働き方をご提案します。"
  },
  {
    q: "対応しているエリアを教えてください",
    a: "愛知県・岐阜県・三重県の東海3県を中心にサービスを提供しています。"
  },
  {
    q: "利用するのにお金はかかりますか？",
    a: "求職者の方のご登録・ご利用はすべて無料です。簡単5分で無料登録いただけます。"
  },
  {
    q: "どんな求人がありますか？（給与の目安）",
    a: "経理事務は年収300～400万円、ハイクラス職は年収700～1,360万円、税理士事務所のお仕事は年収280～850万円が目安です。年間休日120日以上やリモート・時短勤務など、多様な求人もございます。"
  },
  {
    q: "問い合わせ方法や営業時間を教えてください",
    a: "お電話は 0120-964-450 まで。受付時間は月～金（祝日を除く）9:00～18:00です。お急ぎでない場合はWebサイトの無料登録フォームからもお問い合わせいただけます。"
  },
  {
    q: "パスワードを忘れました",
    a: 'こちらから再発行してください。<br><a href="https://keiriss.com/mypage/login/reminder/" target="_blank" rel="noopener">パスワードをお忘れの方</a>',
    html: true
  }
];

const chatArea = document.getElementById('chatArea');
const qrButtons = document.getElementById('qrButtons');
const resetBtn = document.getElementById('resetBtn');

function scrollToBottom(){
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addBubble(text, who, isHtml){
  const row = document.createElement('div');
  row.className = 'bubble-row ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + who;
  if(isHtml){
    bubble.innerHTML = text;
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  chatArea.appendChild(row);
  scrollToBottom();
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'bubble-row bot';
  row.id = 'typingRow';
  const bubble = document.createElement('div');
  bubble.className = 'bubble bot typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(bubble);
  chatArea.appendChild(row);
  scrollToBottom();
}

function removeTyping(){
  const row = document.getElementById('typingRow');
  if(row) row.remove();
}

function renderButtons(){
  qrButtons.innerHTML = '';
  faqs.forEach(function(item, idx){
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = item.q;
    btn.addEventListener('click', function(){
      handleQuestion(idx, btn);
    });
    qrButtons.appendChild(btn);
  });
}

function handleQuestion(idx, btnEl){
  const allButtons = qrButtons.querySelectorAll('.qr-btn');
  allButtons.forEach(function(b){ b.disabled = true; });

  addBubble(faqs[idx].q, 'user');
  addTyping();

  setTimeout(function(){
    removeTyping();
    addBubble(faqs[idx].a, 'bot', !!faqs[idx].html);
    allButtons.forEach(function(b){ b.disabled = false; });
  }, 600);
}

resetBtn.addEventListener('click', function(){
  chatArea.innerHTML = '';
  addBubble('こんにちは！株式会社経理サポートスタッフのご案内チャットです。下のボタンからよくあるご質問をお選びください。', 'bot');
});

renderButtons();
</script>

</body>
</html>
